<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rh-dark-grad" x1="20" y1="15" x2="60" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="rh-orange-grad" x1="60" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FB923C" />
      <stop offset="50%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
    <linearGradient id="rh-orange-light" x1="60" y1="20" x2="90" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDBA74" />
      <stop offset="100%" stopColor="#FB923C" />
    </linearGradient>
    <linearGradient id="rh-orange-dark" x1="70" y1="60" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#EA580C" />
      <stop offset="100%" stopColor="#C2410C" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 0) scale(0.85)">
    <!-- R Monogram -->
    <g id="letter-R">
      <path d="M22 25 L40 15 L40 95 L22 105 Z" fill="url(#rh-dark-grad)" />
      <path d="M40 15 L60 25 L60 55 L40 65 Z" fill="#1E293B" />
      <path d="M40 32 L50 37 L50 48 L40 53 Z" fill="#0F172A" opacity="0.9" />
      <path d="M40 55 L58 64 L58 95 L40 85 Z" fill="#334155" />
    </g>

    <!-- H Monogram -->
    <g id="letter-H">
      <path d="M66 28 L80 20 L80 100 L66 108 Z" fill="url(#rh-orange-light)" />
      <path d="M80 52 L95 44 L95 62 L80 70 Z" fill="url(#rh-orange-grad)" />
      <path d="M95 20 L110 12 L110 92 L95 100 Z" fill="url(#rh-orange-dark)" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="120" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Resource<tspan fill="#F97316">Hub</tspan>
  </text>
  <text x="122" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="4">
    IT ASSET MANAGEMENT
  </text>
</svg>
